# Builds the browser version in release mode and publishes dist/ to the
# marps/ folder of the <owner>.github.io repository (its `master` branch serves
# the site), so the app lives at https://<owner>.github.io/marps/.
# Plain shell steps only: this repo does not allow third-party actions.
#
# One-time setup:
#   1. ssh-keygen -t ed25519 -N "" -C marps-pages -f marps-pages
#   2. In <owner>.github.io: Settings → Deploy keys → add marps-pages.pub with write access.
#   3. In this repo: Settings → Secrets → Actions → PAGES_DEPLOY_KEY = contents of marps-pages.
#   4. In <owner>.github.io: Settings → Pages → deploy from branch `master`, folder `/ (root)`.
name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TRUNK_VERSION: v0.22.0
  # Override with a repository variable to publish to another site repository.
  PAGES_REPO: ${{ vars.PAGES_REPO || format('{0}/{0}.github.io', github.repository_owner) }}
  PAGES_DIR: marps

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Install Rust and trunk
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: trunk build --release

      - name: Publish
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

          # Keep the site repo's history and other content: replace only $PAGES_DIR.
          git clone -q --depth 1 --branch master "git@github.com:${PAGES_REPO}.git" site \
            || { git init -q -b master site && git -C site remote add origin "git@github.com:${PAGES_REPO}.git"; }
          rm -rf "site/${PAGES_DIR}"
          cp -r dist "site/${PAGES_DIR}"
          rm -f "site/${PAGES_DIR}/.trunk-lock"
          touch site/.nojekyll

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged."
          else
            git commit -q -m "Publish ${GITHUB_SHA}"
            git push -q origin master
          fi
