[package]
name = "scaleview"
version = "0.1.0"
edition = "2024"

[features]
# Opens eframe's inspection port (AccessKit widget tree + screenshots) so
# `egui-mcp` can drive the running app. Run with:
#   EGUI_INSPECTION=1 cargo run --features inspection
inspection = ["eframe/inspection"]

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
cpal = "0.17.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0.0"
